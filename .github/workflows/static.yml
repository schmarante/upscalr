# Gets the converted models from this repository's own release, builds the Astro site (dist/) and deploys it to the
# GitHub Pages site of this repository. Only when the model list or the converter changed (no release for this state
# yet) are the published checkpoints converted once and kept as a new release – a deploy never needs a third-party
# server otherwise (user's priority, docs/deployment.md).
name: Deploy to GitHub Pages

on:
  # every push to master
  push:
    branches: ["master"]

  # manual run from the Actions tab
  workflow_dispatch:

# GITHUB_TOKEN may deploy to Pages and create the model release
permissions:
  contents: write
  pages: write
  id-token: write

# only one deployment at a time; queued runs in between are skipped, a running one is not cancelled
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history: the app version counts the commits (astro.config.mjs)

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      # release tag of the current model list + converter (scripts/models-release.mjs)
      - name: Model release
        id: models
        run: echo "tag=$(node scripts/models-release.mjs key)" >> "$GITHUB_OUTPUT"

      # the converted models (public/models/, not in git) from this repository's release, size and sha256 checked;
      # exit code 2 = no release for this state yet
      - name: Fetch models from the release
        id: fetch
        run: |
          if node scripts/models-release.mjs fetch; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            code=$?
            if [ "$code" -ne 2 ]; then exit "$code"; fi
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # --- only for a new state: convert once from the published checkpoints and keep the result as a release ---
      - name: Cache model checkpoints
        if: steps.fetch.outputs.found != 'true'
        uses: actions/cache@v4
        with:
          path: .cache/weights
          key: weights-${{ hashFiles('scripts/models.json') }}

      # checkpoints → ONNX – own converter, Node only (docs/models.md)
      - name: Convert models
        if: steps.fetch.outputs.found != 'true'
        run: npm run models

      # models and their licence texts as assets of a pre-release (never "latest"). With the files, gh creates the
      # release as a draft, uploads everything and only then publishes it – never visible half uploaded, and it also
      # works with immutable releases. A release without the manifest (an older interrupted upload) is completed.
      - name: Publish models as a release
        if: steps.fetch.outputs.found != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.models.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" public/models/*.onnx public/licenses/*.txt --clobber
            gh release upload "$TAG" public/models/manifest.json --clobber
          else
            gh release create "$TAG" public/models/*.onnx public/licenses/*.txt public/models/manifest.json \
              --prerelease --target "$GITHUB_SHA" --title "Models $TAG" \
              --notes "Converted models (ONNX) for this app, made by the deploy workflow from scripts/models.json with the app's own converter. The deploy and npm run models:fetch take them from here; the browser loads them from the site itself. Licences of the weights: the .txt files of this release (also public/licenses/)."
          fi

      # project page lives in a sub directory (/upscalr/): base path and public URL come from the Pages settings.
      # Repository variable SITE_URL (Settings → Secrets and variables → Actions → Variables) overrides the URL,
      # e.g. for a custom domain.
      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          SITE_URL: ${{ vars.SITE_URL || format('{0}/', steps.pages.outputs.base_url) }}

      # dist/ is the document root of the site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
